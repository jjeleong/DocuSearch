services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/data/chroma
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    volumes:
      - docus_data:/app/data
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
volumes:
  docus_data:
  ollama_data:
